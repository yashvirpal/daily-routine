# Local dev container for the app. Source is bind-mounted for hot reload;
# node_modules stays in a named volume (just one now — a single
# package.json at the repo root, no more workspace split) so the
# container's own (Linux) install isn't shadowed by the host's (macOS).
#
# Connects to the SHARED Postgres from ../database over the external
# `db-network` — this compose file does not run its own database. Bring that
# stack up first: `cd ../database && docker compose up -d`.
#
# Usage:
#   docker compose up   # http://localhost:3000

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db-postgres:5432/app?schema=daily_routine
      # Required by schema.prisma's `directUrl` — same connection, no proxy
      # in local/Docker dev (see the comment on DIRECT_URL in .env.example).
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db-postgres:5432/app?schema=daily_routine
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
    networks:
      - db-network
      - default

networks:
  db-network:
    external: true

volumes:
  node_modules:
